name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 iOS 原生工程骨架
        run: |
          flutter create --platforms=ios .
          flutter pub get

      - name: 配置 iOS 16.0 目标版本与相册权限
        run: |
          # 1. 设置工程最低目标为 16.0，满足 onnxruntime 要求
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj

          # 2. 写入相册读写权限描述
          plutil -insert NSPhotoLibraryUsageDescription -string "需要访问相册以导入或保存图片" ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryAddUsageDescription -string "需要将生成的图片保存至相册" ios/Runner/Info.plist || true

      - name: 清理 CocoaPods 并全面启用 Swift Package Manager
        run: |
          cd ios
          # 移除 CocoaPods 对 Xcode 工程的入侵残留
          pod deintegrate || true
          # 删除所有旧 Podfile，避免触发沙盒校验
          rm -rf Podfile Podfile.lock Pods
          cd ..

      - name: 编译无证书 Release 产物
        run: flutter build ios --release --no-codesign

      - name: 封装为 IPA 文件
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -q Plana_iOS.ipa Payload

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Plana-iOS-Package
          path: Plana_iOS.ipa
