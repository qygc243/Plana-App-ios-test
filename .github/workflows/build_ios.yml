name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 iOS 原生工程骨架
        run: |
          flutter create --platforms=ios .
          flutter pub get

      - name: 提升最低支持版本至 iOS 16.0 并注入权限
        run: |
          # 1. 直接将 Xcode 工程目标最低版本修改为 16.0 (满足 flutter-onnxruntime 要求)
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj

          # 2. 注入相册权限描述
          plutil -insert NSPhotoLibraryUsageDescription -string "需要访问相册以导入或保存图片" ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryAddUsageDescription -string "需要将生成的图片保存至相册" ios/Runner/Info.plist || true

          # 3. 写入配套 iOS 16.0 的 Podfile
          cat << 'EOF' > ios/Podfile
          platform :ios, '16.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}."
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
            end
          end
          EOF

      - name: 编译无证书 Release 产物
        run: flutter build ios --release --no-codesign

      - name: 封装为 IPA 文件
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -q Plana_iOS.ipa Payload

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Plana-iOS-Package
          path: Plana_iOS.ipa
