name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 补齐 iOS 原生工程骨架
        run: |
          flutter create --platforms=ios .
          flutter pub get

      - name: 修复 iOS 导入图片直接打开相册
        run: |
          # 仅针对图片格式的 custom 选图，替换为原生相册选择器模式
          find lib -name "*.dart" -type f -exec sed -i '' \
            -e 's/type: FileType.custom/type: FileType.image/g' \
            -e '/allowedExtensions:/d' {} +

      - name: 生成并应用普拉娜应用图标
        run: |
          # 开启 pubspec.yaml 中的 ios 图标开关并自动切图生成各尺寸 Assets
          sed -i '' 's/ios: false/ios: true/g' pubspec.yaml
          dart run flutter_launcher_icons

      - name: 配置 iOS 16.0 目标版本与相册权限
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj
          plutil -insert NSPhotoLibraryUsageDescription -string "需要访问相册以导入或保存图片" ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryAddUsageDescription -string "需要将生成的图片保存至相册" ios/Runner/Info.plist || true

      - name: 清理 CocoaPods 并启用 Swift Package Manager
        run: |
          cd ios
          pod deintegrate || true
          rm -rf Podfile Podfile.lock Pods
          cd ..

      - name: 编译无证书 Release 产物
        run: flutter build ios --release --no-codesign

      - name: 封装为 IPA 文件
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -q Plana_iOS.ipa Payload

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Plana-iOS-Package
          path: Plana_iOS.ipa

